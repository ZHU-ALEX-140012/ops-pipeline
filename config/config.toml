# ops-pipeline 配置
# 唯一需要你修改的文件。凭据一律走环境变量，不写在这里。

[project]
# 项目根目录。留空 = 自动使用"本配置文件所在目录的上一级"，也就是项目目录。
# 推荐留空：这样整个项目文件夹可以随便搬到别处（例如桌面）而不用改配置。
root = ""
# 仅用于展示层的时间转换；存储一律 UTC
timezone_display = "Asia/Shanghai"

# ---------------------------------------------------------------- AI 判断层
[ai]
enabled = true
# dsh profile。当前用自带的 headless 模板；后续想给巡检单独配更便宜的模型，
# 就用：dsh ops --from-default-profile headless   然后改成 "ops"
profile = "headless"
# 覆盖层：让 headless 复用桌面端已登录的 DeepSeek 账号，避免单独申请 API Key。
# 关键——不加这个 patch，headless 会走需要 DEEPSEEK_API_KEY 的 deepseek-official。
patch = "config/dsh-headless.patch.yml"
# dsh 启动器（deepseek harness 安装目录下）
cmd = "D:/AITool/deepseek harness/resources/runtime/cli/bin/dsh.cmd"
# 是否用 --json 抓事件流（原始 NDJSON 会存到 data/runs/ 供事后分析）
json_events = true
# 单次判断的超时（秒）。超时即降级，不阻塞流水线
timeout_seconds = 240
# 判断层子进程的 DSH home（profile / 会话 / 存储 / 缓存都落在这里）。
# 相对路径相对项目根解析；留空同样用默认值 data/dsh-home。
#
# 为什么要重定向：headless profile **每次启动都会重写** <DSH_HOME>/profiles/<name>/cordis.yml。
# 若沿用调用方的真实 ~/.dsh，这个写入就落在工作区之外，在 workspace-write 沙箱里必然被拦，
# 于是每跑一次判断层都要人工点一次提权 —— 无人值守时更会直接 fail-closed。
# 指到项目内之后，判断层的所有写入都在工作区内，不再需要任何提权。
# 账号凭据不在这里：由 config/dsh-headless.patch.yml 单独指回真实 ~/.dsh 读取。
dsh_home = "data/dsh-home"
# 每天最多调用次数，超过则转降级模式（成本闸门）
max_calls_per_day = 30
# AI 失败时的行为：degrade=规则层兜底并标注"未经 AI 分析" | skip=跳过判断
on_failure = "degrade"

# 判断层用的模型。"auto" = 交给下面的分流决定；写具体模型名则**钉死**
# （评测要能分别跑"全便宜"和"全强"两臂，所以需要一个绕过分流的开关）。
model = "auto"
# 模型所属 provider（与 config/dsh-headless.patch.yml 里的一致）
provider = "deepseek-account"

# ---------------------------------------------------------------- 小模型分流
#
# 判断层面对的情形不是同一种难度：
#   机械型（日志源不见了 / 心跳发现任务没跑 / 整轮采到 0 条）—— 事实即结论；
#   解释型（200 但内容变了 / 延迟涨 6 倍但只有单样本 / 冒出新错误模板）——
#   要在几股证据之间做取舍。
#
# 便宜模型不是缩水版，它在明确的情形下够用；强模型的价值集中在"证据互相矛盾"的时候。
# 这个分流是**可配置的先验，不是结论** —— 好坏必须用评测回答：
#   python tools/eval_suite.py --model deepseek-flash      # 全便宜
#   python tools/eval_suite.py --model deepseek-v4-pro     # 全强
#   python tools/eval_suite.py                             # 自动分流
[ai.routing]
enabled = true
cheap_model = "deepseek-flash"
strong_model = "deepseek-v4-pro"
# 异常项达到几个就升级（多股证据要合并）
escalate_min_anomalies = 2
# 失败目标达到几个就升级（可能同源也可能各自独立）
escalate_min_failed = 2
# 出现这些类型一律升级：它们要求"解释"，不只是"报事实"
escalate_kinds = ["structure_change", "latency_regression", "new_error_template",
                  "count_spike", "parse_ratio_low"]
# 每轮都要做汇总综合的任务（句子里没有"异常"，但负担在归纳上）
always_strong_tasks = []

# ---------------------------------------------------------------- 多视角诊断
#
# 单次判断里，模型要在同一次思考中同时回答三个性质不同的问题：
#   目标自身的行为变了吗？（接口/契约镜头）
#   日志里有对应证据吗？（日志证据镜头）
#   这是新问题还是反复出现的？（历史趋势镜头）
# 它们会互相干扰 —— 模型容易抓住最显眼的那条线索就下结论，
# 而最显眼的不一定最相关（一个延迟飙升的错误簇，真实原因可能在三天前的历史里）。
#
# 启用后，判断层会**先并行派子代理分头查证，再汇总**，
# 并被要求逐条标明结论来自哪个镜头。
#
# 代价：**子代理会把 token 消耗放大数倍**。所以只在真的需要多镜头时才开 ——
# 机械型异常（日志源不见了、心跳发现任务没跑）不启用，那种情形事实即结论。
# 触发条件与上面的分流升级条件**故意接近**（都看"是否需要权衡证据"），
# 但两者是独立开关：可以"强模型 + 单镜头"，也可以"便宜模型 + 多镜头"。
[ai.multi_perspective]
enabled = false
max_subagents = 3
trigger_min_anomalies = 2
trigger_kinds = ["structure_change", "latency_regression", "new_error_template",
                 "count_spike", "parse_ratio_low"]

# ---------------------------------------------------------------- 只读调查工具
#
# 给判断层一组收窄到最小的调查动作，每个动作只能碰**配置里已声明过的对象**：
#   read_log       按 [[log_scan.sources]] 的名字读日志（不接受路径，所以没有路径穿越）
#   query_history  以只读方式查历史运行与告警
#   probe_target   按 [[api_watch.targets]] 的名字重新探测
#   read_report    读 data/reports 下某次运行的报告
#
# 为什么必须收窄：判断层自带 fs / fs-search / pwsh / web 工具（见 dsh --dump-config），
# 提示词里写的"不要读日志文件"**只是建议，不是安全边界**。
# 这组工具的价值不在于"给权限"，而在于**把读操作限定到已知对象上**，
# 并且每次运行有硬预算、每次都留审计痕迹。
#
# 今天实际生效的是 CLI（tools/investigate.py，判断层用它已有的 pwsh 调用）；
# MCP 服务端（ops/investigate/mcp.py）协议完整，但 dsh headless 的 profile
# 没有 MCP 客户端的配置面，挂不上去 —— 详见 README。
[investigate]
enabled = true
# 每次运行最多调用几次工具。超过就把"预算用尽"作为工具结果返回，
# 让模型用已有信息作结论 —— 降级，不是失败。
max_calls_per_run = 6
# 单次工具输出上限（字节）。工具输出会直接进上下文，不设上限等于不设成本上限。
max_output_bytes = 6000
# probe 工具的重试次数。探测本身很快，重试主要为了排除偶发抖动
probe_retries = 0

# 会话策略（D2 决策的落地）：
#   persistent = 固定会话，判断层有记忆，能跨天对比趋势；
#   fresh      = 每次新会话，上下文不累积。
# 日报用固定会话；其余用新会话 —— 每小时一次的独立检查如果共用一个会话，
# 上下文会无限膨胀，既贵又容易让模型被无关的历史干扰。
[ai.session_policy]
daily_report = "persistent"
api_watch = "fresh"
regression = "fresh"
log_scan = "fresh"

# ---------------------------------------------------------------- 4.2 接口巡检
[api_watch]
interval_minutes = 60
timeout_ms = 8000
retries = 2
# 目标之间的最小间隔（礼貌调用，别把人家打挂）
rate_limit_ms = 1200
# 每次运行是否都要 AI 写报告（false = 只有出现异常才调 AI，省钱）
always_ai = false

# 监控目标。fault_drill 是自建靶子：用来证明"监控真的能抓到已知故障"
[[api_watch.targets]]
name = "frankfurter"
url = "https://api.frankfurter.app/latest?from=USD&to=CNY"
expect = 200

[[api_watch.targets]]
name = "github_rate"
url = "https://api.github.com/rate_limit"
expect = 200

[[api_watch.targets]]
name = "worldtime"
url = "https://worldtimeapi.org/api/timezone/Asia/Shanghai"
expect = 200

[[api_watch.targets]]
name = "fault_drill"
url = "http://127.0.0.1:8788/health"
expect = 200
# 自建故障靶子默认关闭：不启动靶子时它会一直失败，3 轮后变成一条误报。
# 要做演练时：python tools/fault_drill.py --port 8788，然后把这里改成 true。
enabled = false
note = "自建故障靶子，用来证明告警链路真的通"

[api_watch.thresholds]
# 连续失败几次才告警（抗抖动：一次网络抖动不该打扰你）
consecutive_failures = 3
# "连续失败"只统计这个时间窗口内的样本。
# 不设窗口会让 consecutive_failures 与 failures_24h 自相矛盾（真实踩过这个坑：
# 昨天 17:05 的失败被算进今天的"连续失败"，AI 判断层一眼就指出了不一致）。
streak_max_age_hours = 24
# 延迟超过基线 p95 的几倍算异常
latency_p95_multiple = 3.0
# 基线样本少于这个数时处于冷启动期，改用绝对阈值
cold_start_min_samples = 20

# ---------------------------------------------------------------- 4.1 接口回归
[regression]
# 测谁？留空 base_url 就用内置靶子（演示/自测用）；填上你自己的服务地址就测它。
# 例如：base_url = "http://127.0.0.1:8000"
base_url = ""

# 内置靶子：variant = "v1" 全部通过；"v2" 注入 3 类真实回归：
#   1) 字段改名 name → full_name
#   2) 金额类型 数字 → 字符串
#   3) 查不存在的商品 404 → 200 + null
# 默认 v1：默认配置必须开箱即用，不能一装上就天天误报。
# 想演示"回归抓得到故障"时用： --override regression.variant=v2
service = "targets/service.py"
cases_module = "targets.cases"
variant = "v1"
port = 8799
startup_timeout_s = 20
timeout_ms = 5000
# 每天是否无条件调用 AI 写晨报（false = 只有失败时才调，省钱）
always_ai = false

# ---------------------------------------------------------------- 告警
# ---------------------------------------------------------------- 2.4 日志异常分析
[log_scan]
# 每天是否无条件调用 AI（false = 只有发现异常时才调，省钱）
always_ai = false
# 模板提取（Drain）参数
drain_depth = 4
drain_similarity = 0.5

[log_scan.thresholds]
# 当前窗口与基线窗口各自的长度（小时）。两个窗口紧邻，所以需要 2×window_hours 的日志。
window_hours = 24
# 新错误模板至少出现几次才告警（1 次可能只是抖动）
new_error_min_count = 3
# 首次出现后多少天内仍按"新模板"对待。
# 不设宽限期的话，第二轮它就成了老模板 —— 万一首轮告警被静默/冷却抑制，你就永远收不到通知。
new_template_grace_days = 3
# 量级突增：超过基线的几倍，且绝对次数不低于 spike_min_count
spike_multiple = 5.0
spike_min_count = 20
# 基线窗口少于这么多行就算冷启动：只报告，不做量级判定
min_baseline_lines = 100
# 最新日志距今超过这么多小时 → 判定"日志停止写入"
stale_after_hours = 3
# 能解析出时间戳的行占比低于此值 → 提示日志格式可能变了
parse_ratio_floor = 0.5
# 报告里最多列多少个模板
top_templates = 15
# 用于量级判定的历史窗口数
history_windows = 7

# 日志源。path 支持通配符（例如 "data/logs/*.log"）。
# 换成你自己的日志时，只要改这里；格式支持常见的
# "YYYY-MM-DD HH:MM:SS(.mmm) LEVEL ..." 与 ISO8601（带 Z 或 +08:00）。
[[log_scan.sources]]
name = "app"
path = "data/logs/app.log"
max_lines = 200000

[alert]
# 主通道。可选：email / ntfy / pushplus / wecom（群机器人）/ wecom_app（自建应用）
#
# 为什么最终是 email —— 把每条路都实测过之后的结论：
#   * 企业微信 · 群机器人：需要普通内部群；「全员群」+ 单人企业拿不到入口，
#     拉个人微信会变成「外部群」，一样不支持；
#   * 企业微信 · 自建应用：要先配「可信域名」或「接收消息服务器URL」才能填企业可信IP，
#     前者需已备案域名，后者需公网服务器 —— 个人环境都不具备；
#   * ntfy：服务可达（实测 2.1s），但国内安卓应用商店不让装这个 App；
#   * pushplus：实测返回 code=905「账户未进行实名认证」，而实名要付费（¥3.9 或 ¥10）。
# email 是唯一没有任何前置门槛的：不要实名、不要付费、不经第三方、没有额度上限。
primary = "email"
# 主通道没成功时按顺序再试。dry-run（没配）不算失败，failed 才算。
fallback = ["ntfy", "wecom"]

default_cooldown_minutes = 60
# 静默时段（除 critical 外不发）。留空字符串则关闭
quiet_hours = "23:30-07:30"

# PushPlus：微信扫码登录拿 token，消息推到微信，无需装 App。
# 怎么配：
#   1) 手机或电脑浏览器打开 https://www.pushplus.plus/
#   2) 用微信扫码登录
#   3) 首页会显示你的 token（一串 32 位字符），复制它
#   4) scripts\set-secret.cmd -Name OPS_PUSHPLUS_TOKEN -Masked
# 免费版每天约 200 条，个人告警足够。
# ⚠️ token 就是凭据，别外传。
[alert.pushplus]
token_env = "OPS_PUSHPLUS_TOKEN"
template = "markdown"

# ntfy：服务可达，但国内安卓应用商店不让装这个 App（提示"仅支持出境用户安装"）。
# 如果你能侧载 APK，或想在浏览器里收，就可以用它。
# 配法见 README；话题名要随机（公共服务器上话题是公开的）。
[alert.ntfy]
url_env = "OPS_NTFY_URL"
title = "ops-pipeline"
priority = "default"
tags = "warning"

[alert.wecom]
# 群机器人：需要普通内部群（普通群 ≥2 名企业成员才建得出来）。
# 值只从环境变量或 secrets.local.toml 读，绝不写进仓库。
webhook_env = "OPS_WECOM_WEBHOOK"

# 企业微信自建应用（单人企业也能用）。
# 三个值从哪拿：
#   CorpID  —— 管理后台 → 我的企业 → 企业信息 → 最下方「企业ID」
#   AgentId —— 管理后台 → 应用管理 → 自建 → 创建应用 → 建好后在应用详情页
#   Secret  —— 同上，点「查看」并发送到企业微信里查看
# ⚠️ 别忘了把该应用的**可见范围**设成包含你自己，否则会返回 invaliduser。
# 三个值都写进 config/secrets.local.toml；用 scripts\set-wecom-app.cmd 最省事。
[alert.wecom_app]
corpid_env = "OPS_WECOM_CORPID"
secret_env = "OPS_WECOM_SECRET"
agentid_env = "OPS_WECOM_AGENTID"
# 发给谁：@all = 该应用可见范围内的所有人（也就是你自己）
touser = "@all"

[alert.email]
# 主通道。配法见 README「配置邮件告警」；凭据同样只从环境变量或 secrets.local.toml 读。
enabled = true
smtp_host = "smtp.qq.com"
smtp_port = 465
user_env = "OPS_MAIL_USER"
pass_env = "OPS_MAIL_PASS"
to_env = "OPS_MAIL_TO"

# ---------------------------------------------------------------- 价格监控
#
# 把骨架复用到"盯价格"这个场景：采集换成"按配置抓价格字段"，
# 判据换成价格语义（到价 / 单次涨跌 / 窗口新低 / 数据源静默），
# 其余（落库、AI 归因、去重冷却、邮件、报告、只读工具、小模型分流）全部复用。
#
# 采集支持三种来源（写在一个商品块里就是它了）：
#   source = "manual"  → 人工录入，用 tools/price_set.py 记一条（**最实用**）
#   source = "json"    → JSON 接口，配 url + price_path
#   source = "html"    → 任意页面，配 url + price_regex
#
# ⚠️ 实测结论（2026-10 于本机）：**有价格的站点全都自动抓不到** ——
# NVIDIA 官方 store 超时、B&H / Micro Center 返回 403、
# 京东 / 什么值得买 / 慢慢买返回反爬页，而官方商品页本身不带价格（营销页）。
# 这不是"配置没写对"，是这类站点的常态。所以：
#   * `manual` 是**一等公民**，不是补丁；
#   * 想自动抓，先用 tools/price_probe.py 试出正则：
#       python tools/price_probe.py --url "https://你的源/"
#     它会告诉你页面里有没有价格、以及能直接粘过来的 price_regex；
#   * 换源只改配置、不改代码。
#
# 演示用：先起本地价格源（一个桩，不碰任何真实站点）
#   python tools/price_stub.py --port 8790
# 然后把下面三个演示商品的 enabled 改成 true。
[price_watch]
timeout_ms = 8000
# 历史回看天数（用于判断"是否创新低"）
history_days = 30
# 每轮都调用判断层。
#
# ⚠️ 这里**必须开**：判断层要回答的是"现在该不该买、买哪个"，
#    而那是一个**跨候选的比较结论** —— 只有它每轮都看一遍全部候选才给得出来。
#    不开的话，只有出现异常时才会有人来分析，平静的日子你就得不到建议了。
#
#    成本可以忽略：一次判断约几万 token，按现在便宜模型的价目就是几分钱。
#    一天一次，一个月不到一块钱。
always_ai = true
# 采集间隔内的最小请求间隔，避免把对方打疼
rate_limit_ms = 800

# 默认判据。单个商品没写自己的判据时用它。
[price_watch.default_rules]
# 到价提醒（这是唯一"绝对"的判据 —— 价格没有"正常值"）
target_price = 4000
# 单次变化幅度阈值（相对上一次，不是相对中位数）
drop_percent = 8
rise_percent = 15
# 创 N 天新低（历史样本少于 3 条时不做这个判断）
new_low_days = 14
# 多久没**成功抓到**就认为数据源挂了（注意：价格"没变"不算）
stale_hours = 6

# ================================================================ 价格监控示例
#
# ⚠️ **这里故意只放示例，不放"我真正要盯的东西"。**
#
# 真正要盯的商品清单属于私人内容 —— 它等于公开了"我正在比价买什么、预算多少"。
# 所以它放在 **config/config.local.toml** 里：那个文件不进版本库，并且会覆盖这里。
# 规则：字典逐层合并，**列表整体替换**。
#
# 下面三条指向本地演示桩（tools/price_stub.py），默认关着：
#     python tools/price_stub.py --port 8790      # 先把桩起起来
#   然后把 enabled 改成 true，就能走一遍"突然降价 → 到价提醒"的完整流程。
#
# 想加自己的商品，照这个形状写（或写进 config.local.toml）：
#
#   [[price_watch.items]]
#   name = "某商品"
#   label = "给人看的名字（写上配置，比价才比得对）"
#   source = "html"                      # 或 json / manual，见 README
#   url = "https://item.example.com/product/123.html"
#   price_regex = '"price"\s*:\s*"?([0-9.]+)"?'
#   platform = "某平台"                   # 同一 platform 才能直接比价
#   spec = "128G+4TB"                    # 比价必须同 spec 比
#   min_price = 1000                     # 合理性区间：**必需**，见 README
#   max_price = 50000
#   target_price = 2000                  # 到价就叫我
#   watch_stock = true                   # 有货/缺货也盯（可选）

# ================================================================ 演示用（默认关闭）
#
# 这三项指向本地桩服务（tools/price_stub.py），用来演示"突然降价 → 到价提醒"。
# 它们默认关着：没起桩就会每轮都报"没抓到价格"。
[[price_watch.items]]
name = "rtx5070"
label = "RTX 5070 显卡"
url = "http://127.0.0.1:8790/price/rtx5070"
# JSON 取值路径（支持 a.b.0.c）；本地桩把价格放在 data.price 下
price_path = "data.price"
currency = "CNY"
enabled = false
# 单个商品的判据可以直接写在这里，覆盖 default_rules
target_price = 4000
drop_percent = 8

[[price_watch.items]]
name = "rtx5080"
label = "RTX 5080 显卡"
url = "http://127.0.0.1:8790/price/rtx5080"
price_path = "data.price"
currency = "CNY"
enabled = false
target_price = 7500

[[price_watch.items]]
name = "rx9070"
label = "RX 9070 显卡"
url = "http://127.0.0.1:8790/price/rx9070"
price_path = "data.price"
currency = "CNY"
enabled = false
target_price = 3800

# ---------------------------------------------------------------- 每日日报
# 设计方案 §12 的「报告统一入口」：不管有没有异常都发一份，
# 让"今天一切正常"也成为一条明确信息（而不是靠沉默去推断）。
[daily_report]
# 统计窗口（小时）。日报在窗口结束时刻生成，汇总窗口内的运行与告警。
window_hours = 24

# ---------------------------------------------------------------- 人工反馈
#
# 离线黄金集能回答"模型在 19 个场景上多准"，回答不了"它在你这儿多准"。
# 真实环境里的误报往往长得跟黄金集里的不一样 —— 只有收到邮件的人知道。
#
# 怎么用：收到告警邮件后**直接回复**，正文写「对」或「错」即可。
# 系统靠主题里的 `#<标记>` 认领是哪一条；下一轮 feedback_scan 就会记上。
#
# 为什么不是"点邮件里的链接"：链接要有一个从手机可达的地址，
# 而家宽既没有公网 IP 也没有域名 —— 点了只会打到手机上。
# 这和当初企业微信回调 URL 撞的是同一堵墙。回复邮件不需要任何可达地址。
[feedback]
enabled = true
imap_host = "imap.qq.com"
imap_port = 993
mailbox = "INBOX"
# 每轮最多处理几封未读
max_messages = 20
# 处理成功后标记已读（关掉的话每轮都会重复处理同一封）
mark_seen = true
# 凭据复用发信用的那两个（同一个 QQ 邮箱账号）
user_env = "OPS_MAIL_USER"
pass_env = "OPS_MAIL_PASS"

# ---------------------------------------------------------------- 心跳
# 每个任务"应该多久跑一次"（分钟）。心跳任务据此判断有没有静默失败。
# 只列**实际注册了计划任务**的项：声明了却没注册，心跳会一直报"从未运行过"。
[schedule.heartbeat_expect]
api_watch = 60
regression = 1440
daily_report = 1440
heartbeat = 1440
# log_scan 默认不注册（register_tasks.ps1 需要显式加 -IncludeLogScan），
# 因为它的日志源默认还指向演示用的合成日志。
# 把它指向你自己的日志、加 -IncludeLogScan 注册之后，把下面这行也加回来，
# 否则心跳不会检查"日志分析有没有按预期运行"。
# log_scan = 1440
